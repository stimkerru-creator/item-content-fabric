plugins { id 'application' }
def release = new Properties()
file('../gradle.properties').withInputStream { release.load(it) }
group = 'dev.itemcontent'
version = release.getProperty('version')
repositories { mavenCentral() }
dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.formdev:flatlaf:3.7.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
}
application { mainClass = 'dev.itemcontent.editor.ItemContentEditor' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { useJUnitPlatform(); systemProperty 'java.awt.headless', 'true'; systemProperty 'flatlaf.uiScale', project.findProperty('testUiScale') ?: '1' }
tasks.named('jar') {
    manifest { attributes 'Main-Class': application.mainClass.get() }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { zipTree(it) } }
    from('../LICENSE') { into 'META-INF'; rename { 'LICENSE-item-content.txt' } }
    from('../THIRD-PARTY-NOTICES.txt') { into 'META-INF' }
    from('licenses/flatlaf-LICENSE.txt') { into 'META-INF/licenses'; rename { 'FlatLaf-LICENSE.txt' } }
    from('licenses/gson-LICENSE.txt') { into 'META-INF/licenses'; rename { 'Apache-2.0.txt' } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
}

sourceSets.main.java.srcDir '../common/src/main/java'

// The ready editor embeds already-compiled registration code. Users need no build toolchain.
tasks.register('prepareStandaloneRuntime', Exec) {
    workingDir file('..')
    inputs.files(fileTree('../src/main'), fileTree('../common/src/main'), fileTree('../standalone-runtime'), file('../standalone-runtime.gradle'), file('../build.gradle'), file('../gradle.properties'))
    outputs.file(file("../build/standalone-runtime/itemcontent-generated-runtime-${version}.jar"))
    def wrapper = System.getProperty('os.name').startsWith('Windows') ? 'gradlew.bat' : './gradlew'
    commandLine wrapper, 'remapGeneratedRuntimeJar', '--no-daemon'
    if (gradle.startParameter.offline) args '--offline'
}
tasks.named('processResources') {
    dependsOn 'prepareStandaloneRuntime'
    from("../build/standalone-runtime/itemcontent-generated-runtime-${version}.jar") {
        into 'dev/itemcontent/editor'; rename { 'standalone-runtime.jar' }
    }
}

// Exports the real native-model example through the same code used by the UI.
tasks.register('exportModelFixture', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.itemcontent.editor.NativeModelFixture'
    args file('..').absolutePath, file('../build/native-model-fixture').absolutePath
    doFirst { delete file('../build/native-model-fixture') }
}
tasks.register('exportStandaloneFixture', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.itemcontent.editor.StandaloneFixture'
    args file('..').absolutePath, file('../build/standalone-fixture').absolutePath
    doFirst { delete file('../build/standalone-fixture') }
}
tasks.register('previewModBuilder', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.itemcontent.editor.ModBuilderPreview'
    systemProperty 'flatlaf.uiScale', project.findProperty('testUiScale') ?: '1'
    args file('../examples/content-types.icproject').absolutePath, file('../build/mod-builder.png').absolutePath
}
