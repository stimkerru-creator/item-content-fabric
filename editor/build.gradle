plugins { id 'application' }
def release = new Properties()
file('../gradle.properties').withInputStream { release.load(it) }
group = 'dev.itemcontent'
version = release.getProperty('version')
repositories { mavenCentral() }
dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.formdev:flatlaf:3.7.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
}
application { mainClass = 'dev.itemcontent.editor.ItemContentEditor' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { useJUnitPlatform(); systemProperty 'java.awt.headless', 'true'; systemProperty 'flatlaf.uiScale', project.findProperty('testUiScale') ?: '1' }
tasks.named('jar') {
    manifest { attributes 'Main-Class': application.mainClass.get() }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { zipTree(it) } }
    from('../LICENSE') { into 'META-INF'; rename { 'LICENSE-item-content.txt' } }
    from('../THIRD-PARTY-NOTICES.txt') { into 'META-INF' }
    from('licenses/flatlaf-LICENSE.txt') { into 'META-INF/licenses'; rename { 'FlatLaf-LICENSE.txt' } }
    from('licenses/gson-LICENSE.txt') { into 'META-INF/licenses'; rename { 'Apache-2.0.txt' } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
}

sourceSets.main.java.srcDir '../common/src/main/java'
