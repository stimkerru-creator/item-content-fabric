plugins { id 'fabric-loom' version '1.6.12'; id 'maven-publish' }
group = project.maven_group
version = project.version
base { archivesName = 'item-content-fabric' }
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
 modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
 modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
 testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(Test).configureEach { useJUnitPlatform() }
// Compile the desktop sources only into the test source set to verify its export
// against the real runtime loader without bundling Swing into the Fabric JAR.
sourceSets.test.java.srcDir 'editor/src/main/java'
sourceSets.test.resources.srcDir 'editor/src/main/resources'
sourceSets.test.java.exclude '**/ItemContentEditor.java', '**/EditorTheme.java', '**/CatalogDialog.java', '**/BehaviorForm.java', '**/GameInstallation.java', '**/InstallationDialog.java'

// Include our license in the distributed mod, alongside Minecraft-provided dependencies.
tasks.named('jar') {
    from('LICENSE') { rename { 'LICENSE-item-content.txt' } }
    from('THIRD-PARTY-NOTICES.txt')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

sourceSets.main.java.srcDir 'common/src/main/java'

// Opt-in isolated real-game test. The fixture/provider never enters the release JAR.
sourceSets {
    integrationTest {
        java.srcDir 'integration-test/src/main/java'
        resources.srcDir 'integration-test/src/main/resources'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('integrationTestJar', Jar) {
    dependsOn integrationTestClasses
    archiveClassifier = 'integration-test'
    destinationDirectory = layout.buildDirectory.dir('integration-fixture')
    from sourceSets.integrationTest.output
}
loom.mods {
    itemcontent { sourceSet sourceSets.main }
    itemcontent_integration { sourceSet sourceSets.integrationTest }
}
loom.runs {
    integrationClient {
        client()
        source sourceSets.integrationTest
        name 'Item Content isolated integration client'
        runDir 'build/integration-client'
        programArgs '--quickPlaySingleplayer', 'testworld', '--width', '1280', '--height', '720'
    }
    integrationServer {
        source sourceSets.integrationTest
        server()
        name 'Item Content isolated integration server'
        runDir 'build/integration-server'
    }
}
tasks.register('prepareIntegrationServer') {
    doLast {
        def root = file('build/integration-server'); root.mkdirs()
        def accepted = file('run/eula.txt')
        if (project.findProperty('acceptMinecraftEula')?.toString() != 'true' && (!accepted.exists() || !accepted.text.contains('eula=true')))
            throw new GradleException('Accept the Minecraft EULA before running: -PacceptMinecraftEula=true')
        new File(root, 'eula.txt').text = 'eula=true\n'
        new File(root, 'server.properties').text = 'server-ip=127.0.0.1\nserver-port=25576\nonline-mode=false\nlevel-type=minecraft:flat\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\nmax-tick-time=120000\n'
        copy { from 'integration-test/items.json'; into new File(root,'config/item-content'); rename { 'items.json' } }
        def tags = new File(root,'world/datapacks/item-content/data/minecraft/tags/blocks'); tags.mkdirs()
        new File(root,'world/datapacks/item-content/pack.mcmeta').text = '{"pack":{"pack_format":15,"description":"Integration test tags"}}'
        new File(tags,'mineable').mkdirs()
        new File(tags,'mineable/pickaxe.json').text = '{"values":["itemcontent:block"]}'
        new File(tags,'needs_iron_tool.json').text = '{"values":["itemcontent:block"]}'
        delete new File(root, 'integration-result.txt')
    }
}
tasks.named('runIntegrationServer') {
    dependsOn integrationTestJar, prepareIntegrationServer
    doLast {
        def report = file('build/integration-server/integration-result.txt')
        if (!report.exists() || !report.text.startsWith('PASS ')) throw new GradleException('Game integration did not pass; see build/integration-server/logs/latest.log')
        println report.text
    }
}

tasks.named('runIntegrationClient') {
    dependsOn integrationTestClasses, 'prepareIntegrationClient'
    doLast {
        def report = file('build/integration-client/client-integration-result.txt')
        if (!report.exists() || !report.text.startsWith('PASS ')) throw new GradleException('Client integration failed; see its latest.log')
        println report.text
    }
}

// This copies only the world generated by runIntegrationServer into our own build directory.
tasks.register('prepareIntegrationClient') {
    dependsOn runIntegrationServer
    doLast {
        def root=file('build/integration-client'); root.mkdirs()
        copy { from 'integration-test/items.json'; into new File(root,'config/item-content'); rename { 'items.json' } }
        copy { from 'build/integration-server/world'; into new File(root,'saves/testworld') }
        new File(root,'options.txt').text='resourcePacks:["vanilla","fabric","file/item-content"]\nlang:ru_ru\nrenderDistance:2\nsimulationDistance:5\nmaxFps:60\nonboardAccessibility:false\n'
        def pack=new File(root,'resourcepacks/item-content'); pack.mkdirs()
        new File(pack,'pack.mcmeta').text='{"pack":{"pack_format":15,"description":"Integration test models"}}'
        ['block','decorative_chest','decorative_furnace'].each { name ->
            def assets=new File(pack,'assets/itemcontent')
            new File(assets,'models/block').mkdirs(); new File(assets,'models/item').mkdirs(); new File(assets,'blockstates').mkdirs()
            new File(assets,"models/block/${name}.json").text=groovy.json.JsonOutput.toJson([parent:'minecraft:block/cube_all',textures:[all:'minecraft:block/copper_block']])
            new File(assets,"models/item/${name}.json").text=groovy.json.JsonOutput.toJson([parent:"itemcontent:block/${name}"])
            new File(assets,"blockstates/${name}.json").text=groovy.json.JsonOutput.toJson([variants:['':[model:"itemcontent:block/${name}"]]])
        }
        // Opt-in fixture generated by the desktop import/export task; never reads user packs.
        if (project.findProperty('testNativeModels')?.toString() == 'true') {
            def fixture=file('build/native-model-fixture')
            if (!new File(fixture,'config/item-content/items.json').exists()) throw new GradleException('Run editor: exportModelFixture first')
            def parser=new groovy.json.JsonSlurper()
            def configFile=new File(root,'config/item-content/items.json')
            def config=parser.parse(configFile)
            config.items.addAll(parser.parse(new File(fixture,'config/item-content/items.json')).items)
            configFile.text=groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
            copy { from new File(fixture,'resourcepacks/item-content'); into pack }
        }
        // Stale reports/catalogs generated by this test must not make a later run falsely pass.
        delete new File(root,'client-integration-result.txt'), new File(root,'config/item-content/catalog.json')
    }
}
