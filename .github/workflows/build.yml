name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p editor build --no-daemon
      - run: ./gradlew -p editor test --no-daemon -PtestUiScale=1.25
      - run: ./gradlew -p editor test --no-daemon -PtestUiScale=1.5

  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - run: ./gradlew -p editor build --no-daemon
      - run: python3 tools/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: item-content
          if-no-files-found: error
          path: |
            build/libs/item-content-fabric-*.jar
            editor/build/libs/item-content-editor-*.jar
            build/distributions/item-content-*.zip
            build/distributions/*-SHA256SUMS.txt
