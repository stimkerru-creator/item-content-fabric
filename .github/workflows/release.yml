name: Ready-to-run release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: .\gradlew.bat build --no-daemon
      - run: .\gradlew.bat -p editor build --no-daemon
      - run: python tools/prepare-windows-runtime.py
      - name: Package the editor, mod, resources and Java
        shell: pwsh
        run: |
          $runtime = (Get-ChildItem build/windows-runtime -Directory | Select-Object -First 1).FullName
          python tools/package-release.py --windows-runtime $runtime
          $version = ((Get-Content gradle.properties | Where-Object { $_ -match '^version=' }) -split '=',2)[1]
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF -ne "refs/tags/v$version") { throw 'Tag does not match gradle.properties version' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/check-windows-release.ps1 -Archive "build/distributions/item-content-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: item-content-ready-to-run
          path: |
            build/distributions/item-content-*.zip
            build/distributions/*-SHA256SUMS.txt
            build/distributions/OpenJDK17U-jdk-sources_*.tar.gz
            build/libs/item-content-fabric-*.jar
      - name: Publish downloadable files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Item Content ${{ env.RELEASE_VERSION }}
          body_path: docs/releases/${{ env.RELEASE_VERSION }}.md
          fail_on_unmatched_files: true
          files: |
            build/distributions/item-content-*.zip
            build/distributions/*-SHA256SUMS.txt
            build/distributions/OpenJDK17U-jdk-sources_*.tar.gz
            build/libs/item-content-fabric-*.jar
